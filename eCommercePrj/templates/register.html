<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Ticaret Sitesi</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/03397e9a7e.js" crossorigin="anonymous"></script>
    <style>
        .pl-5 {
            padding-left: 50px;
        }

        .pl-4 {
            padding-left: 40px;
        }

        .pl-3 {
            padding-left: 30px;
        }

        .pl-2 {
            padding-left: 20px;
        }

        .pl-1 {
            padding-left: 10px;
        }

        .pr-5 {
            padding-right: 50px;
        }

        .pr-4 {
            padding-right: 40px;
        }

        .pr-3 {
            padding-right: 30px;
        }

        .pr-2 {
            padding-right: 20px;
        }

        .pr-1 {
            padding-right: 10px;
        }

        .ml-5 {
            margin-left: 50px;
        }

        .ml-4 {
            margin-left: 40px;
        }

        .ml-3 {
            margin-left: 30px;
        }

        .ml-2 {
            margin-left: 20px;
        }

        .ml-1 {
            margin-left: 10px;
        }

        .mr-5 {
            margin-right: 50px;
        }

        .mr-4 {
            margin-right: 40px;
        }

        .mr-3 {
            margin-right: 30px;
        }

        .mr-2 {
            margin-right: 20px;
        }

        .mr-1 {
            margin-right: 10px;
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .content {
            flex: 1 0 auto;
        }

        footer {
            flex-shrink: 0;
        }

        /* Ekstra Stil (İsteğe Bağlı) */
        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            padding: 10px;
        }

        .card-img-top {
            height: 250px;
            object-fit: cover;
        }

        @media (max-width: 767.98px) {
            .carousel {
                margin-bottom: 20px;
            }
        }
        
        #login:hover {
    background-color: #2ecc71; /* Üzerine gelindiğinde değişecek renk */
}
#register:hover {
    background-color: #2ecc71; /* Üzerine gelindiğinde değişecek renk */
}
    </style>
</head>

<body>
    <div class="d-flex flex-column min-vh-100">
        <div class="container">
            <!-- NavBar -->
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <a class="navbar-brand" href="index.html">E-Ticaret</a>
                    <a class="nav-link navbar-brand ml-2" aria-current="page" href="{% url "index" %}">
                        <button type="button" class="btn btn-info">Anasayfa</button>
                    </a>
                    <a class="nav-link navbar-brand ml-2" aria-current="page" href="{% url "category_list" %}">
                        <button type="button" class="btn btn-info">Kategoriler</button>
                    </a>
                    <!-- Search Form -->
                    <div class="navbar-brand mx-auto">
                        <form class="d-flex" role="search">
                            <input class="form-control me-2" type="search" placeholder="Bu Ortaya Alinacak" aria-label="Search">
                            <button class="btn btn-outline-info" type="submit">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </button>
                        </form>
                    </div>
                    <!-- Toggler and Collapse -->
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <!-- Right Side -->
                    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                        <!-- User Dropdown -->
                        <div class="dropdown">
                            <button type="button"
                                class="btn btn-info d-flex align-items-center justify-content-center m-2 dropdown-toggle"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                <a class="nav-link m-0" href="#">
                                    <span class="badge bg-warning me-2">
                                        <i class="fa-regular fa-user" style="width: 20px;"></i>
                                    </span>
                                    Meric
                                </a>
                            </button>
                            <ul class="dropdown-menu">
                                <li>
                                    <a class="dropdown-item" href="#">
                                        <button type="button" class="btn btn-info w-100 text-center">
                                            Hesabim
                                        </button>
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="orders.html">
                                        <button type="button" class="btn btn-info w-100 text-center">
                                            Siparişlerim
                                        </button>
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="#">
                                        <button type="button" class="btn btn-info w-100 text-center">
                                            Beğendiklerim
                                        </button>
                                    </a>
                                </li>
                            </ul>
                        </div>
                        <!-- Cart Button -->
                        <button type="button" class="btn btn-info d-flex align-items-center justify-content-center m-2">
                            <a class="nav-link m-0" href="#">
                                <span class="badge bg-warning me-2">
                                    <i class="fa-solid fa-basket-shopping"></i>
                                </span>
                                Sepet
                            </a>
                        </button>
                    </div>
                </div>
            </nav>
        </div>
        <!-- Content -->
        <div class="container">
            <div class="row">
                <div class="col-sm-3 position-absolute top-50 start-50 translate-middle">
                    <div class="card text-center">
                        {% if errors %}
                        <div class="alert alert-danger">
                            {{errors}}
                        </div>
                        {% endif %}
                        <div class="card-header">
                            <ul class="nav nav-pills card-header-pills justify-content-center">
                                <li class="nav-item">
                                    <a class="btn" id="login" href="{% url "userauths:signin" %}">Giris Yap</a>
                                </li>
                                <li class="nav-item">
                                    <a class="btn active" style="background-color: #2ecc71;" id="register" href="{% url "userauths:signup" %}">Kayit Ol</a>
                                </li>
                            </ul>
                        </div>
                        <div class="card-body" style="padding-left: 20px; padding-right: 20px;">
                            <form method="POST" action="">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label for="firstname" style="float: left;" class="form-label">Ad</label>
                                    <input type="text" name="firstname" class="form-control"  id="firstname" placeholder="Adinizi Girin" required>
                                </div>
                                <div class="mb-3">
                                    <label for="lastname" style="float: left;" class="form-label">Soyad</label>
                                    <input type="text" name="lastname" class="form-control"  id="lastname" placeholder="Soyadinizi Girin" required>
                                </div>
                                <div class="mb-3">
                                    <label for="username" style="float: left;" class="form-label">Kullanici Adi</label>
                                    <input type="text" name="username" class="form-control"  id="username" placeholder="Kullanici Adinizi Girin" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" style="float: left;" class="form-label">E-posta</label>
                                    <input type="email" name="email" class="form-control"  id="email" placeholder="E-postanızı Girin" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password" style="float: left;" class="form-label">Şifre</label>
                                    <input type="password" name="password" class="form-control" id="password" placeholder="Şifrenizi Girin" required>
                                </div>
                                <div class="mb-3">
                                    <label for="password2" style="float: left;" class="form-label">Şifre Tekrar</label>
                                    <input type="password" name="passwordagain" class="form-control" id="password2" placeholder="Şifrenizi Tekrar Girin" required>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">Kayit Ol</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
          <!-- End Content -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
