<div class="row">
    <h4 class="p-3 m-3">My Wishlist <span class="badge text-bg-primary">{{ wishlist.count }}</span></h4>
    {% for p in wishlist %}
        <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
            <div class="card shadow-lg p-0">
                <button type="button" data-wishlist-product="{{ p.id }}" class="btn float-left delete-wishlist-product" style="width: 20px;">
                    <i class="fa fa-heart text-danger" aria-hidden="true"></i>
                </button>
                <img src="{{ p.product.image.url }}" class="card-img-top" alt="Ürün 1" style="width: 100%; height: 250px; object-fit: contain;">
                <div class="card-body text-center" style="padding: 50px;">
                    <a class="btn p-0" href="{% url "products_detail" p.product.pid %}"><h5>{{ p.product.title }}</h5></a>
                    <p>{{ p.product.description|safe }}</p>
                    <p class="card-text text-warning fw-bold">
                        {% for i in p.full_stars %}
                            <i class="fa-solid fa-star"></i>
                        {% endfor %}
                        {% if p.half_star %}
                            <i class="fa-solid fa-star-half-stroke"></i>
                        {% endif %}
                        {% for i in p.empty_stars %}
                            <i class="fa-regular fa-star"></i>
                        {% endfor %}
                    </p>
                </div>
            </div>
        </div>
    {% endfor %}
</div>
