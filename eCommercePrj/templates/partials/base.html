{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Ticaret Sitesi</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/03397e9a7e.js" crossorigin="anonymous"></script>
    <style>
        .pl-5 {
            padding-left: 50px;
        }

        .pl-4 {
            padding-left: 40px;
        }

        .pl-3 {
            padding-left: 30px;
        }

        .pl-2 {
            padding-left: 20px;
        }

        .pl-1 {
            padding-left: 10px;
        }

        .pr-5 {
            padding-right: 50px;
        }

        .pr-4 {
            padding-right: 40px;
        }

        .pr-3 {
            padding-right: 30px;
        }

        .pr-2 {
            padding-right: 20px;
        }

        .pr-1 {
            padding-right: 10px;
        }

        .ml-5 {
            margin-left: 50px;
        }

        .ml-4 {
            margin-left: 40px;
        }

        .ml-3 {
            margin-left: 30px;
        }

        .ml-2 {
            margin-left: 20px;
        }

        .ml-1 {
            margin-left: 10px;
        }

        .mr-5 {
            margin-right: 50px;
        }

        .mr-4 {
            margin-right: 40px;
        }

        .mr-3 {
            margin-right: 30px;
        }

        .mr-2 {
            margin-right: 20px;
        }

        .mr-1 {
            margin-right: 10px;
        }

        /* Ekstra Stil (İsteğe Bağlı) */
        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            padding: 10px;
        }

        .card:hover {
            transform: scale(1.05);
            transition: transform 0.3s;
        }
        .no-hover:hover {
            background-color: inherit; /* Varsayılan arka plan */
            transform: none; /* Büyüme efektini kaldır */
            transition: none; /* Geçiş efektini kaldır */
        }

        .card-img-top {
            height: 250px;
            object-fit: cover;
        }

        @media (max-width: 767.98px) {
            .carousel {
                margin-bottom: 20px;
            }
        }
        .custom-select {
            width: 250px;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease-in-out;
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
        }
        
        .custom-select:hover {
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        .custom-select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0px 0px 0px 0.2rem rgba(0, 123, 255, 0.25);
        }
        #tag_link:hover {
            border-bottom: 1px solid #007bff;
        }
        .content_form {
            display: none;
            margin-top: 10px;
        }

        .content_form2 {
            display: none;
            margin-top: 10px;
        }

        /* Buton stili */
        .toggle-button {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        .toggle-button:hover {
            background-color: #45a049;
        }
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .content {
            flex: 1 0 auto; 
        }
        
        footer {
            flex-shrink: 0; 
            margin-top: auto;
        }
    </style>
</head>
<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script rel="javascript" type="text/javascript" src="{% static "assets/js/function.js" %}"></script>
<body>
{% csrf_token %}

    <div class="d-flex flex-column min-vh-100">
        <div class="container">
            <!-- NavBar -->
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <a class="navbar-brand" href="index.html">E-Ticaret</a>
                    <a class="nav-link navbar-brand ml-2" aria-current="page" href="{% url "index" %}">
                        <button type="button" class="btn btn-info">Anasayfa</button>
                    </a>
                    <a class="nav-link navbar-brand ml-2" aria-current="page" href="{% url "category_list" %}">
                        <button type="button" class="btn btn-info">Kategoriler</button>
                    </a>
                    <!-- Search Form -->
                    <div class="navbar-brand mx-auto">
                        <form class="d-flex" role="search" action="{% url "products_list" %}" method="GET">
                            <input class="form-control me-2" type="search" placeholder="Bu Ortaya Alinacak" aria-label="Search" name="q" value="{{ request.GET.q }}">
                            <button class="btn btn-outline-info" type="submit">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </button>
                        </form>
                    </div>
                    <!-- Toggler and Collapse -->
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <!-- Right Side -->
                    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                        {% if request.user.is_authenticated %}
                        <!-- User Dropdown -->
                        <div class="dropdown">
                            <button type="button"
                                class="btn btn-info d-flex align-items-center justify-content-center m-2 dropdown-toggle"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                <a class="nav-link m-0" href="#">
                                    <span class="badge bg-warning me-2">
                                        <i class="fa-regular fa-user" style="width: 20px;"></i>
                                    </span>
                                    {{request.user.first_name}}
                                </a>
                            </button>
                            <ul class="dropdown-menu">
                                {% if request.user.is_vendor %}
                                <li>
                                    <a class="dropdown-item" href="{% url "useradmin:dashboard" %}">
                                        <button type="button" class="btn btn-info w-100 text-center">
                                            Satici Paneli
                                        </button>
                                    </a>
                                </li>
                                {% endif %}
                                <li>
                                    <a class="dropdown-item" href="{% url "dashboard" %}">
                                        <button type="button" class="btn btn-info w-100 text-center">
                                            Hesabim
                                        </button>
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="{% url "orders" %}">
                                        <button type="button" class="btn btn-info w-100 text-center">
                                            Siparişlerim
                                        </button>
                                    </a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="{% url "wishlist" %}">
                                        <button type="button" class="btn btn-info w-100 text-center">
                                            Beğendiklerim
                                        </button>
                                    </a>
                                </li>
                            </ul>
                        </div>
                        <!-- Cart Button -->
                        <button type="button" class="btn btn-info d-flex align-items-center justify-content-center m-2">
                            <a class="nav-link m-0" href="{% url "cart" %}">
                                <span class="badge bg-warning me-2">
                                    <i class="fa-solid fa-basket-shopping"></i>
                                </span>
                                <span class="cart-items-count">
                                Sepet {{cart|length}}
                                </span>
                            </a>
                        </button>
                        
                        <button type="button" class="btn btn-info d-flex align-items-center justify-content-center m-2">
                            <a class="nav-link m-0" href="{% url "userauths:signout" %}">
                                <span class="badge bg-warning me-2">
                                    <i class="fa-solid fa-right-from-bracket"></i>
                                </span>
                                Cikis Yap
                            </a>
                        </button>
                        {%else%}
                        <button type="button" class="btn btn-info d-flex align-items-center justify-content-center m-2">
                            <a class="nav-link m-0" href="{% url "userauths:signin" %}">
                                <span class="badge bg-warning me-2">
                                    <i class="fa-solid fa-right-from-bracket"></i>
                                </span>
                                Giris Yap
                            </a>
                        </button>
                        <!-- Cart Button -->
                        <button type="button" class="btn btn-info d-flex align-items-center justify-content-center m-2">
                            <a class="nav-link m-0" href="{% url "cart" %}">
                                <span class="badge bg-warning me-2">
                                    <i class="fa-solid fa-basket-shopping"></i>
                                </span>
                                <span class="cart-items-count">
                                    Sepet {{request.session.cart_data_obj|length}}
                                </span>
                            </a>
                        </button>
                        {% endif %}
                    </div>
                </div>
            </nav>
        </div>
    {% if messages %}
        <div class="mt-3">
            {% for m in messages %}
                <div class="alert alert-warning alert-dismissible fade show" role="alert">
                    {{ m }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}
        {% block content %}
        
        {% endblock content %}
