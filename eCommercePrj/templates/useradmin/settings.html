{% include "useradmin/partials/base.html" %} 

{% load static %}

{%block content %}
    <style>
        .profile-image-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .profile-image {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #ddd;
        }
    </style>
    <div class="container mt-5">
        <h2 class="mb-4">Kullanıcı Bilgisi Güncelleme</h2>
        <form method="post" enctype="multipart/form-data" class="row g-4">
            {% csrf_token %}
            <!-- Sol Üstte Profil Resmi -->
            <div class="col-md-4">
                {% if profile.image %}
                <div class="profile-image-container">
                    <img src="{{ profile.image.url }}" alt="Profil Resmi" class="profile-image" id="profilePreview">
                    <input type="file" class="form-control mt-3" id="image" name="image" onchange="previewImage(event)">
                </div>
                {% else %}
                <div class="profile-image-container">
                    <svg xmlns="http://www.w3.org/2000/svg" height="160" width="140" viewBox="0 0 448 512"><!--!Font Awesome Free 6.7.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2024 Fonticons, Inc.--><path d="M224 256A128 128 0 1 0 224 0a128 128 0 1 0 0 256zm-45.7 48C79.8 304 0 383.8 0 482.3C0 498.7 13.3 512 29.7 512l388.6 0c16.4 0 29.7-13.3 29.7-29.7C448 383.8 368.2 304 269.7 304l-91.4 0z"/></svg>
                    <input value="" type="file" class="form-control mt-3" id="image" name="image" onchange="previewImage(event)">
                </div>
                {% endif %}
            </div>
            <!-- Sağdaki Form Alanları -->
            <div class="col-md-8">
                <div class="mb-3">
                    <label for="full_name" class="form-label">Tam Ad</label>
                    <input value="{{profile.title}}" type="text" class="form-control" id="full_name" name="full_name" placeholder="Tam adınızı girin" required>
                </div>
                <div class="mb-3">
                    <label for="bio" class="form-label">Biyografi</label>
                    <input value="{{profile.description}}" class="form-control" id="bio" name="bio" rows="3" placeholder="Kendiniz hakkında kısa bir biyografi yazın">
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Telefon</label>
                    <input value="{{profile.contact}}" type="tel" class="form-control" id="phone" name="phone" placeholder="Telefon numaranızı girin">
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Adres</label>
                    <input value="{{profile.address}}" type="text" class="form-control" id="address" name="address" placeholder="Adresinizi girin">
                </div>
                <div class="mb-3">
                    <label for="country" class="form-label">Ülke</label>
                    <input value="{{profile.country}}" type="text" class="form-control" id="country" name="country" placeholder="Ulkenizi girin">
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Güncelle</button>
                </div>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('profilePreview');
                output.src = reader.result;
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>
</body>
</html>


{%endblock content%}
