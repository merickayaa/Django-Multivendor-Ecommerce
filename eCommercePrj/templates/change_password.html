{% include "partials/base.html" %} 

{% load static %}

{%block content %}
    <style>
        .password-change-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #f9f9f9;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        ul.no-bullets {
            list-style-type: none;
            margin: 0;
            padding: 0;
          }
    </style>
    <div class="container">
        <div class="password-change-container">
            <h2 class="text-center mb-4">Şifre Değiştirme</h2>
            {% if messages %}
            <ul class="messages no-bullets">
                {% for message in messages %}
                <li class="alert alert-warning" role="alert">{{ message }}</li>
                {% endfor %}
            </ul>
            {% endif %}
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="old_password" class="form-label">Mevcut Şifre</label>
                    <input type="password" class="form-control" id="old_password" name="old_password" placeholder="Mevcut şifrenizi girin" required>
                </div>
                <div class="mb-3">
                    <label for="new_password" class="form-label">Yeni Şifre</label>
                    <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Yeni şifrenizi girin" required>
                </div>
                <div class="mb-3">
                    <label for="confirm_new_password" class="form-label">Yeni Şifre (Tekrar)</label>
                    <input type="password" class="form-control" id="confirm_new_password" name="confirm_new_password" placeholder="Yeni şifrenizi tekrar girin" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Şifreyi Güncelle</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{% endblock content %}
